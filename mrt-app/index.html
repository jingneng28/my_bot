<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SG MRT" />
  <meta name="theme-color" content="#0b1220" />
  <title>SG MRT Time</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>SG MRT Journey Time</h1>
      <p class="subtitle">Personalised for trips from Choa Chu Kang</p>
    </header>

    <section class="form">
      <label for="from">From</label>
      <select id="from"></select>

      <button id="swap" type="button" aria-label="Swap stations" title="Swap">⇅</button>

      <label for="to">To</label>
      <select id="to"></select>

      <button id="go" type="button" class="primary">Find route</button>
    </section>

    <section id="result" class="result" hidden></section>

    <p class="note">
      Times from Choa Chu Kang to the stations on your personal list use your
      given durations. Every other pair assumes 3 min between adjacent
      stations and 3 min to change lines.
    </p>
  </main>

  <script src="data.js"></script>
  <script src="router.js"></script>
  <script src="app.js"></script>
</body>
</html>
